version: '3.8'

services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:14-alpine
    container_name: terrenos-postgres
    environment:
      POSTGRES_DB: terrenos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - terrenos-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin (opcional, para gestión visual de BD)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: terrenos-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@terrenos.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - terrenos-network
    depends_on:
      - postgres

  # Tests del backend (unit tests)
  backend-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    container_name: terrenos-backend-test
    environment:
      - SPRING_PROFILES_ACTIVE=test
    working_dir: /app
    command: ["mvn", "test", "-B"]

  # Backend Java Spring Boot
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: terrenos-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=jdbc:postgresql://postgres:5432/terrenos_db
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - SPRING_PROFILES_ACTIVE=dev
      - CV_ENGINE_URL=http://cv-engine:8000
      - FILE_UPLOAD_DIR=/app/uploads
    volumes:
      - ./uploads:/app/uploads
    networks:
      - terrenos-network
    depends_on:
      postgres:
        condition: service_healthy
      cv-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Frontend React SPA (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8080/api/v1
    container_name: terrenos-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - terrenos-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Microservicio Computer Vision (Python)
  cv-engine:
    build:
      context: ./cv-engine
      dockerfile: Dockerfile
    container_name: terrenos-cv-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - UPLOAD_DIR=/app/uploads
      - MAX_IMAGE_DIMENSION=8000
      - MIN_LOTE_AREA=1000
      - MAX_LOTE_AREA=5000000
      - THREAD_WORKERS=4
    volumes:
      - ./uploads:/app/uploads
    networks:
      - terrenos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Tests del microservicio Computer Vision (unit tests)
  cv-engine-test:
    build:
      context: ./cv-engine
      dockerfile: Dockerfile
    container_name: terrenos-cv-engine-test
    working_dir: /app
    command: ["python", "-m", "unittest", "discover", "-s", ".", "-p", "test_*.py", "-v"]

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  terrenos-network:
    driver: bridge
